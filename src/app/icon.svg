<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Container Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Grid Lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
  <line x1="12" y1="34" x2="52" y2="34" stroke="#334155" stroke-width="1" stroke-dasharray="2 2" opacity="0.4" />
  <line x1="12" y1="48" x2="52" y2="48" stroke="#334155" stroke-width="1" opacity="0.5" />
  
  <!-- Area Under Chart -->
  <path d="M 12 44 L 22 36 L 32 40 L 42 22 L 52 16 L 52 48 L 12 48 Z" fill="url(#areaGrad)" />
  
  <!-- Rising Stock Trend Line -->
  <path d="M 12 44 L 22 36 L 32 40 L 42 22 L 52 16" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Highlight Peak Node Dot -->
  <circle cx="52" cy="16" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="42" cy="22" r="2.5" fill="#3b82f6" />
  <circle cx="22" cy="36" r="2.5" fill="#06b6d4" />
</svg>
